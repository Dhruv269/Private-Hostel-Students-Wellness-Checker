<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><radialGradient id='g' cx='50%25' cy='50%25' r='50%25'><stop offset='0%25' stop-color='%2300c2ff'/><stop offset='100%25' stop-color='%231677ff'/></radialGradient></defs><circle cx='50' cy='50' r='42' fill='url(%23g)'/><circle cx='50' cy='50' r='42' stroke='%2360a5fa' stroke-width='4' fill='none'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HostelWell — Find Your Balance | Student Wellness Sanctuary</title>
    <meta name="description" content="A calm, futuristic wellness sanctuary for hostel students in India to observe academic stress, daily stamina, and emotional equilibrium." />
    <!-- Google Fonts for accessible, modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Immediate theme & calm mode restoration to prevent flashing -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('hostelwell-theme');
          var theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);

          var savedCalm = localStorage.getItem('hostelwell-calm-mode');
          var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          var isCalm = savedCalm !== null ? savedCalm === 'true' : prefersReducedMotion;
          if (isCalm) {
            document.documentElement.setAttribute('data-calm-mode', 'true');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
