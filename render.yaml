services:
  - type: web
    name: hostelwell-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 5002
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMMA_MODEL_ID
        value: gemma-4-26b-a4b-it
      - key: CLIENT_URL
        sync: false
